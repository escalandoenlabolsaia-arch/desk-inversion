name: desk-inversion

on:
  workflow_dispatch:          # botón "Run workflow" para pruebas manuales
  schedule:
    - cron: "0 23 * * 1-5"    # lunes a viernes, 23:00 UTC (20:00 hs Argentina)

jobs:
  correr:
    runs-on: ubuntu-latest
    permissions:
      contents: write         # permite commitear el historial de alertas
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar desk
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python3 datos.py    # TEMPORAL: prueba de datos. Al final lo cambiamos a main.py

      - name: Guardar historial
        run: |
          git config user.name "desk-bot"
          git config user.email "actions@users.noreply.github.com"
          git add *.csv 2>/dev/null || true
          git diff --cached --quiet || git commit -m "historial desk [skip ci]"
          git push || echo "sin cambios"
